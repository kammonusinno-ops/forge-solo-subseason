# Copy into plugins/ForgeSoloSubseason/config.yml on the Termux test server.
# This file contains no secrets.
anti-cramming:
  enabled: true
  threshold: 15
  interval-ticks: 20
  protect-named-or-tamed: true
hall:
  enabled: false
  world: "SET_ME"
  x: 0
  y: 0
  z: 0
  radius: 12
skills:
  pvp-scale: 0.6
  max-active-slots: 4
  allow-client-key-chords: false
  effects-must-use-vanilla-actions: true
