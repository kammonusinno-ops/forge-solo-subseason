name: ForgeSoloSubseason
version: ${version}
main: com.forgemagic.paper.ForgeSoloSubseasonPlugin
author: kammonusinno-ops
description: Forge Magic server-authoritative survival economy foundation
api-version: '26.2'
load: POSTWORLD
commands:
  wallet:
    description: Show your Tomaterrency wallet balance
    usage: /wallet
    aliases: [balance]
    permission: forgesolo.wallet
  pay:
    description: Pay whole TMT to an online player
    usage: /pay <player> <amount>
    permission: forgesolo.pay
  class:
    description: Permanently choose your seasonal class
    usage: /class choose <class>
    permission: forgesolo.class
  skills:
    description: Show the server-authoritative skill catalog
    usage: /skills
    permission: forgesolo.skills
permissions:
  forgesolo.wallet:
    default: true
  forgesolo.pay:
    default: true
  forgesolo.class:
    default: true
  forgesolo.skills:
    default: true
